interface:
  display_name: "External Orchestrator"
  short_description: "Choose next work and assess task readiness"
  default_prompt: "Use $external-orchestrator to recommend the next action from the current Linear queue and repository context."

dependencies:
  tools:
    - type: "mcp"
      value: "linear"
      description: "Read the current work queue; delegate writes to create-linear-task"

policy:
  allow_implicit_invocation: true
